[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "phonebook-rag-ai-testing"
version = "0.3.0"
description = "Educational RAG and AI testing project with Anthropic, FastAPI, ChromaDB, pytest and DeepEval"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [{name = "Training Project"}]
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.48.0",
  "pydantic-settings==2.14.1",
  "anthropic==1.5.0",
  "chromadb==1.5.9",
  "sentence-transformers==6.0.1",
  "deepeval==4.2.2",
  "pytest==9.0.2",
  "httpx==0.28.1",
  "python-dotenv==1.2.2"
]

[project.scripts]
rag-index = "scripts.index_knowledge_base:main"
rag-retrieve = "scripts.show_retrieval:main"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
